name: Android debug build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies and test
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          npm run build
      - name: Generate native project
        run: |
          npm run android:add
          npm run android:sync
      - name: Prepare SDK and compile
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sdk_manager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdk_manager" ]; then
            echo "Android SDK command-line tools missing under $sdk_root" >&2
            exit 1
          fi
          export ANDROID_HOME="$sdk_root"
          export ANDROID_SDK_ROOT="$sdk_root"
          "$sdk_manager" 'platforms;android-36' 'build-tools;36.0.0'
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain assembleDebug
      - name: Publish test APK as prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk return-window-debug.apk
          sha256sum return-window-debug.apk > SHA256SUMS.txt
          gh release create "debug-${GITHUB_RUN_ID}" return-window-debug.apk SHA256SUMS.txt \
            --target "$GITHUB_SHA" --prerelease --title "Debug build ${GITHUB_RUN_ID}" \
            --notes 'Development APK. Native purchases and notification delivery are not yet verified. Test Store configuration is blank; this is not a production or final contest release.'
